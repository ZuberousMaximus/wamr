name: wamr
services:
  wamr:
    container_name: wamr
    image: ghcr.io/techieanant/wamr:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-9002}:9000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-9000}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/wamr.db}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env.prod (openssl rand -base64 32) and pass --env-file .env.prod}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env.prod (openssl rand -hex 32) and pass --env-file .env.prod}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - WHATSAPP_SESSION_PATH=${WHATSAPP_SESSION_PATH:-/app/.baileys_auth}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-5}
      - MEDIA_MONITORING_INTERVAL_MS=${MEDIA_MONITORING_INTERVAL_MS:-300000}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-flash-latest}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_PRETTY=${LOG_PRETTY:-false}
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - ${BAILEYS_PATH:-./.baileys_auth}:/app/.baileys_auth
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:9000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
